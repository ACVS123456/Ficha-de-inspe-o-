<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Inspeção Sanitária</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,Helvetica,sans-serif;color:#111}
.page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:12mm;box-shadow:0 2px 12px #999}
.header{border:2px solid #111}
.title{height:30mm;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:700;border-bottom:2px solid #111;position:relative}
.logo{position:absolute;width:105px;height:auto;left:50%;top:3mm;transform:translateX(-50%)}
.title span{margin-top:14mm}
.meta{display:grid;grid-template-columns:1fr 1.25fr 1fr}
.meta div{min-height:9mm;border-right:1px solid #111;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:2px}
.meta div:last-child{border-right:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #111;height:7mm;padding:2px 5px;font-size:13px}
th{font-weight:700;text-align:center}
th.item{width:10%} th.lojas{width:27%} th.eq{width:15.75%}
.equip-title{font-size:15px;height:9mm}
td{text-align:center}
td:nth-child(2){text-align:left}
select{width:100%;height:25px;border:0;background:transparent;text-align:center;text-align-last:center;font-weight:700;font-size:13px;cursor:pointer}
select:focus{outline:1px solid #555}
.rel-title{border:1px solid #111;text-align:center;font-weight:700;font-size:15px;padding:3px}
.report{width:100%;height:42mm;border:1px solid #111}
.report-line{height:8.4mm;border-bottom:1px solid #111;padding:2px 5px}
.report-line:last-child{border-bottom:0}
.footer{border:2px solid #111;border-top:0;display:grid;grid-template-columns:1fr 1fr;font-size:13px;font-weight:700}
.legend{text-align:left}
.legend div,.totals div{min-height:7mm;padding:2px 5px;display:flex;align-items:center}
.legend .center{text-align:center;justify-content:center;border-bottom:1px solid #111}
.totals div{justify-content:flex-end}
.actions{width:210mm;margin:15px auto;text-align:center}
button{border:0;border-radius:7px;padding:11px 18px;margin:4px;background:#111;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#555}
input{border:0;font:inherit;font-weight:700;text-align:center;background:transparent;width:100%}
@media print{
 body{background:#fff}
 .page{margin:0;width:210mm;min-height:297mm;padding:12mm;box-shadow:none}
 .actions{display:none}
 @page{size:A4 portrait;margin:0}
}
@media(max-width:800px){
 .page{width:100%;min-height:auto;margin:0;padding:15px;overflow-x:auto}
 .actions{width:100%}
 .title{font-size:14px}
 th,td{font-size:10px}
}
</style>
</head>
<body>

<div class="actions">
  <button onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button class="secondary" onclick="limparCampos()">↻ Limpar C/N/C</button>
</div>

<main class="page">
  <section class="header">
    <div class="title">
      <img class="logo" src="logo_mangabeira_crop.png" alt="Mangabeira Shopping">
      <span>DEPARTAMENTO DE FISCALIZAÇÃO SANITÁRIA - FICHA DE INSPEÇÃO</span>
    </div>

    <div class="meta">
      <div><input id="data" value="DATA 28/07/2026"></div>
      <div><input id="inicio" value="VISTORIA - INICIO: 18h"></div>
      <div><input id="bc" value="BC WASHINGTON"></div>
    </div>
  </section>

  <table>
    <thead>
      <tr>
        <th class="item" rowspan="2">ITEM</th>
        <th class="lojas" rowspan="2">LOJAS</th>
        <th class="eq equip-title" colspan="4">EQUIPAMENTOS</th>
      </tr>
      <tr>
        <th class="eq">Coifa</th>
        <th class="eq">Fogão</th>
        <th class="eq">Chapa</th>
        <th class="eq">Fritadeira</th>
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

  <div class="rel-title">RELATÓRIO</div>
  <div class="report" contenteditable="true">
    <div class="report-line"></div>
    <div class="report-line"></div>
    <div class="report-line"></div>
    <div class="report-line"></div>
    <div class="report-line"></div>
  </div>

  <div class="footer">
    <div class="legend">
      <div class="center">Legenda:</div>
      <div>N/C = Não conforme</div>
      <div>C = Conforme</div>
    </div>
    <div class="totals">
      <div>Total de lojas: <span id="total">24</span></div>
      <div>Lojas aptas: <span id="aptas">24</span></div>
      <div>Lojas que não se enquadra: <span id="nao">00</span></div>
    </div>
  </div>
</main>

<script>
const dados=[
[1,"Bonaparte","C","","C","C"],
[2,"Burger King","C","","C","C"],
[3,"Divino Fogão","C","C","C","C"],
[4,"Giraffas","C","C","C","C"],
[5,"Griletto","C","C","C","C"],
[6,"McDonald's","C","C","C","C"],
[7,"Mini Kalzone","C","","",""],
[8,"Mister Pizza","C","C","",""],
[9,"Zeny","C","C","","C"],
[10,"The B-Burgue","C","C","C","C"],
[11,"Yassay","C","C","C","C"],
[12,"Camarão & Cia","C","C","C","N/C"],
[13,"Bob´s loja","C","","C","C"],
[14,"Subway","C","","",""],
[15,"Empadinha","C","","",""],
[16,"Cinepólis","C","","",""],
[17,"Popeys","C","","","C"],
[18,"Terraço café","C","","",""],
[19,"Copa café","","","C",""],
[20,"Sal e Brasa","C","C","C","C"],
[21,"Girau","C","C","C","C"],
[22,"Duas x Doce","C","","","C"],
[23,"KFC","C","","","C"],
[24,"L´AH CHURROS","","","","C"]
];

const tbody=document.getElementById("corpo");

dados.forEach((d,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${d[0]}</td><td>${d[1]}</td>`+
    d.slice(2).map((v,j)=>`
      <td>
        <select data-row="${i}" data-col="${j}" onchange="atualizar()">
          <option value="" ${v===""?"selected":""}></option>
          <option value="C" ${v==="C"?"selected":""}>C</option>
          <option value="N/C" ${v==="N/C"?"selected":""}>N/C</option>
        </select>
      </td>`).join("");
  tbody.appendChild(tr);
});

function atualizar(){
  let nao=0;
  document.querySelectorAll("tbody tr").forEach(tr=>{
    const selects=[...tr.querySelectorAll("select")];
    if(selects.some(s=>s.value==="N/C")) nao++;
  });
  const total=dados.length;
  document.getElementById("total").textContent=total;
  document.getElementById("nao").textContent=String(nao).padStart(2,"0");
  document.getElementById("aptas").textContent=total-nao;
}

function limparCampos(){
  document.querySelectorAll("select").forEach(s=>s.value="");
  atualizar();
}

atualizar();
</script>
</body>
</html>
